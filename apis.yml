aid: kaedim
name: Kaedim
description: >-
  Kaedim is an AI 3D asset generation company (backed by a16z) that turns 2D
  images — photos, sketches and concept art — into production-ready 3D models
  for games, e-commerce and simulation. The Enterprise Web API lets developers
  integrate Kaedim's 2D-to-3D pipeline into internal modelling workflows and
  user-generated-content products: submit up to six images at a chosen level of
  quality, track generation by requestID, receive results via signed webhooks,
  and download models in obj, fbx, glb, gltf, mtl and usd formats. Kaedim also
  ships first-party plugins for Unity, Unreal, Blender, Cinema 4D and NVIDIA
  Omniverse. Authentication uses an X-API-Key header plus a 12-hour JWT bearer
  token; generation is asynchronous and completes in roughly 10-15 minutes.
